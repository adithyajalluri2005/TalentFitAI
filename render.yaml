services:
  - type: web
    name: talentfitai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # free tier has no persistent disks and sleeps on idle
    healthCheckPath: /
    disk:
      name: talentfitai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/jds.db
      - key: GROQ_API_KEY
        sync: false        # set in the Render dashboard
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false        # e.g. https://talentfitai.vercel.app
